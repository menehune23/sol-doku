  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="kicker">// Logic core</div>
        <h1>Stardoku</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="open-hue" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><path d="M15 4v4M9 10v4M17 16v4"/></svg>
        </button>
        <button class="icon-btn" id="open-reset" aria-label="Reset puzzle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>
        </button>
        <button class="icon-btn" id="open-new" aria-label="New game">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <section class="panel status" aria-label="Game status">
      <div><span class="label">Level</span><span class="readout" id="stat-level">—</span></div>
      <div id="time-block"><span class="label">Time</span><span class="readout" id="stat-time">00:00</span></div>
      <div id="err-block"><span class="label">Errors</span><span class="readout" id="stat-mistakes">0</span></div>
    </section>

    <div class="board-wrap">
      <div class="board" id="board" role="grid" aria-label="Stardoku board"></div>
    </div>

    <section class="tools" aria-label="Tools">
      <button class="tool" id="hint">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
        <span>Hint</span>
        <i class="badge" id="hint-count"></i>
      </button>
      <button class="tool" id="undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        <span>Undo</span>
      </button>
      <button class="tool" id="erase">
        <svg class="ic-erase" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M20 20H8l-5-5 10-10 8 8-6 7"/><path d="M8.5 9.5l7 7"/></svg>
        <svg class="ic-clear" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="square"><g stroke="none"><rect x="4" y="4" width="3" height="3"/><rect x="10.5" y="4" width="3" height="3"/><rect x="17" y="4" width="3" height="3"/><rect x="4" y="10.5" width="3" height="3"/><rect x="17" y="10.5" width="3" height="3"/><rect x="4" y="17" width="3" height="3"/><rect x="10.5" y="17" width="3" height="3"/><rect x="17" y="17" width="3" height="3"/></g><path d="M3 21L21 3" fill="none"/></svg>
        <span>Erase</span>
      </button>
      <button class="tool" id="notes" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>
        <span>Notes</span>
      </button>
    </section>

    <section class="pad" id="pad" aria-label="Number pad"></section>

    <footer class="footer">
      <a href="https://github.com/menehune23/sol" target="_blank" rel="noopener">What is Sol?</a>
      <a href="https://app.devin.ai/sessions/24729240f18b49819ce347943eb49a1e" target="_blank" rel="noopener">Request changes</a>
    </footer>
  </main>

  <dialog class="sheet" id="new-sheet" aria-labelledby="new-title">
    <div class="grabber" title="Close" aria-hidden="true"></div>
    <div class="kicker">// New mission</div>
    <h2 id="new-title">Select difficulty</h2>
    <div class="levels" id="levels" role="radiogroup" aria-labelledby="new-title"></div>
    <button class="btn" id="start">Generate grid</button>
    <button class="btn ghost" data-close>Cancel</button>
  </dialog>

  <dialog class="sheet" id="reset-sheet" aria-labelledby="reset-title">
    <div class="grabber" title="Close" aria-hidden="true"></div>
    <div class="kicker">// Purge input</div>
    <h2 id="reset-title">Reset puzzle?</h2>
    <p class="sheet-note">Clears your entries, notes, hints and time. The starting grid stays the same.</p>
    <button class="btn danger" id="do-reset">Reset</button>
    <button class="btn ghost" data-close>Cancel</button>
  </dialog>

  <dialog class="sheet" id="hue-sheet" aria-labelledby="hue-title">
    <div class="grabber" title="Close" aria-hidden="true"></div>
    <div class="kicker">// System</div>
    <h2 id="hue-title">Settings</h2>
    <div class="setting-label" id="color-label">Color</div>
    <div class="hues" id="hues" role="radiogroup" aria-labelledby="color-label"></div>
    <div class="hue-name" id="hue-name"></div>
    <div class="toggles">
      <label class="toggle"><span><strong>Timer</strong><small>Show elapsed time</small></span><input type="checkbox" id="set-timer" role="switch"><i aria-hidden="true"></i></label>
      <label class="toggle"><span><strong>Errors</strong><small>Mark wrong numbers in red and count them</small></span><input type="checkbox" id="set-errors" role="switch"><i aria-hidden="true"></i></label>
      <label class="toggle"><span><strong>Hints</strong><small>Show the Hint button</small></span><input type="checkbox" id="set-hints" role="switch"><i aria-hidden="true"></i></label>
    </div>
    <button class="btn" data-close>Done</button>
  </dialog>

  <dialog class="sheet" id="win-sheet" aria-labelledby="win-title">
    <div class="grabber" title="Close" aria-hidden="true"></div>
    <div class="kicker">// Grid stabilized</div>
    <h2 id="win-title">Puzzle solved</h2>
    <dl class="stats" id="win-stats"></dl>
    <button class="btn" id="win-new">New game</button>
    <button class="btn ghost" data-close>View grid</button>
  </dialog>

  <div class="overlay" id="loading" hidden>
    <div class="scan"><div class="bars"><i></i><i></i><i></i><i></i><i></i></div><span>Generating grid</span></div>
  </div>

  <script src="sudoku.js"></script>
  <script src="sol.js"></script>
  <script src="app.js"></script>
</body>
</html>
